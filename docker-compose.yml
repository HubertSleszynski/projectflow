name: projectflow-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow_local_dev
      POSTGRES_DB: projectflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - projectflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  projectflow_pgdata:
