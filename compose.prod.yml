name: projectflow-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectflow
      POSTGRES_DB: projectflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow -d projectflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    environment:
      DATABASE_URL: postgresql://projectflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/projectflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      DATABASE_URL: postgresql://projectflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/projectflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_PROXY_TARGET: http://api:3001
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: http://api:3001
    depends_on: [api]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
